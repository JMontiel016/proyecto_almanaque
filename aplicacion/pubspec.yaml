# Identificador técnico; el nombre visible es Zunpi.
name: zunpi
description: Dinosaurio individual con salto y agachado corporal.
publish_to: none
version: 0.5.0+5
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0 # Vista nativa HD y flujo de imágenes Android.
  image: ^4.5.4 # JPEG pequeño en un hilo Dart separado; sin detección corporal.
  shared_preferences: ^2.3.3 # Identidad y dirección del servidor.
  http: ^1.3.0 # Ranking y diagnóstico.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icono.png
